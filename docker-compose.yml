services:

  wordpress:
    image: wordpress
    restart: always
    ports:
      - 8080:80
    env_file:
      - .env
    volumes:
      - wordpress:/var/www/html

  db:
    image: mysql:8.0
    restart: always
    secrets:
      - db_password
    environment:
      MYSQL_DATABASE: exampledb
      MYSQL_USER: exampleuser
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_RANDOM_ROOT_PASSWORD: '1'
    volumes:
      - db:/var/lib/mysql

secrets:
  db_password:
    file: ./db_password.txt  # Ruta al archivo con el secret

volumes:
  wordpress:
  db: